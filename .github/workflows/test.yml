name: test

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: write

jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: Apply async mutation barrier fix
        if: github.ref == 'refs/heads/fix/series-export-flush-barrier'
        run: node scripts/apply-async-mutation-barrier-fix.cjs
      - run: npm test
      - run: node --check series-storage.js
      - run: node --check series-ordering.js
      - run: node --check series-schema.js
      - run: node --check workspace-storage.js
      - run: node --check series.js
      - run: node --check series-archive.js
      - run: node --check storage.js
      - run: node --check app.js
      - run: node --check characters.js
      - run: node --check plot.js
      - run: node --check chapter-workspace-controller.js
      - run: node --check workspace-loader.js
      - name: Commit verified async mutation barrier changes
        if: github.ref == 'refs/heads/fix/series-export-flush-barrier'
        run: |
          if git diff --quiet -- app.js characters.js plot.js; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js characters.js plot.js
          git commit -m 'fix: track remaining async archive mutations'
          git push
