name: test

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: write

jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: Normalize archive barrier formatting
        if: github.ref == 'refs/heads/fix/series-export-flush-barrier'
        run: node scripts/normalize-archive-barrier-format.cjs
      - run: npm test
      - run: node --check app.js
      - run: node --check characters.js
      - run: node --check plot.js
      - run: node --check series.js
      - name: Commit normalized source
        if: github.ref == 'refs/heads/fix/series-export-flush-barrier'
        run: |
          if git diff --quiet -- app.js characters.js plot.js; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js characters.js plot.js
          git commit -m 'style: normalize archive barrier changes'
          git push
