name: test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test
      - run: node --check series-storage.js
      - run: node --check series-ordering.js
      - run: node --check series-schema.js
      - run: node --check workspace-storage.js
      - run: node --check series.js
      - run: node --check series-archive.js
      - run: node --check storage.js
      - run: node --check app.js
      - run: node --check chapter-workspace-controller.js
      - run: node --check workspace-loader.js