name: agent-apply-series-restore-ui

on:
  push:
    branches:
      - feat/series-archive-restore
    paths:
      - scripts/agent-apply-series-restore-ui.cjs
      - .github/workflows/agent-apply-series-restore-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused Series restore UI patch
        run: node scripts/agent-apply-series-restore-ui.cjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html series.js chapter-workspace-controller.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: restore series archives from the topbar"
          git push origin HEAD:feat/series-archive-restore
